# docker-compose.yml — runs the whole encodr backend stack as one system.
#
# Run it:   docker-compose pull && docker-compose up    (pull images, then start)
#
# AUTH:     aws ecr get-login-password --region us-east-1 | \
#             docker login --username AWS --password-stdin 491884381318.dkr.ecr.us-east-1.amazonaws.com
#
# NETWORKING: compose puts every service on one private network and makes each
# service name a hostname. So the api reaches Redis at host `redis`, port 6379
# -> the `REDIS_URL: redis://redis:6379` override below. No IPs needed.

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    image: 491884381318.dkr.ecr.us-east-1.amazonaws.com/encodr-backend:latest
    command: node ./dist/app.js
    ports:
      - "3000:3000"
    env_file:
      - apps/backend/.env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

  worker:
    image: 491884381318.dkr.ecr.us-east-1.amazonaws.com/encodr-backend:latest
    command: node ./dist/worker.js
    env_file:
      - apps/backend/.env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

  sqs-consumer:
    image: 491884381318.dkr.ecr.us-east-1.amazonaws.com/encodr-backend:latest
    command: node ./dist/sqs-consumer.js
    env_file:
      - apps/backend/.env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
